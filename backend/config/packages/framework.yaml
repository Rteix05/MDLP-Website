# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    rate_limiter:
        # Login : 5 tentatives par minute par IP
        auth_login:
            policy: sliding_window
            limit: 5
            interval: '1 minute'
        # Register : 3 créations par heure par IP
        auth_register:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        # Forgot password : 3 demandes par heure par IP
        auth_forgot_password:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
        # Formulaire de contact : 5 messages par heure par IP
        contact_form:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
