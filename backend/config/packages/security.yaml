security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    # C'est ici que tu avais l'erreur d'alignement
    access_control:
        - { path: ^/api/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/events, roles: PUBLIC_ACCESS }
        - { path: ^/api/contact, roles: PUBLIC_ACCESS }
        - { path: ^/api/payment/stripe-webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/payment/stripe-session, roles: PUBLIC_ACCESS }
        - { path: ^/api/payment/by-session, methods: [GET], roles: PUBLIC_ACCESS }
        
        # 👇 NOUVELLE LIGNE : On autorise la lecture (GET) des news à tout le monde
        - { path: ^/api/news, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/courses, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/appointments/blocked-slots, methods: [GET], roles: PUBLIC_ACCESS }

        # 👇 Cette ligne bloque tout ce qui n'est pas autorisé au-dessus
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }