lexik_jwt_authentication:
    # For local/dev convenience we fall back to an HMAC (HS256) symmetric
    # encoder if a raw JWT secret is provided. This avoids needing an
    # encrypted RSA private key in dev environments.
    # In production you should use RS256 with properly protected private keys.

    # Use a raw secret for HS256 (set JWT_SECRET in .env.local)
    secret_key: '%env(JWT_SECRET)%'
    # Keep pass_phrase present for compatibility (unused for HS256)
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    encoder:
        signature_algorithm: HS256
